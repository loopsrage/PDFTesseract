
HttpServer:
  Addr: "0.0.0.0:8081"
  ReadTimeout: 0
  ReadHeaderTimeout: 0
  WriteTimeout: 0
  IdleTimeout: 0
  MaxHeaderBytes: 10485760

PDFium:
  MinIdle: 1
  MaxIdle: 1
  MaxTotal: 7
  Command:
    BinPath: "go"
    Args:
      - "run"
      - "/pdfpipeline/pdfium/worker/main.go"

PDFTesseract:
  Enabled: true
  Queue:
    Max: 150
    Wait: 150
    Stagger: 0
  PageRender:
    Max: 150
    Wait: 150
    Stagger: 0
  TableData:
    Max: 150
    Wait: 150
    Stagger: 0
  Receive:
    Max: 150
    Wait: 150
    Stagger: 0
HttpServer:
  Addr: "0.0.0.0:8081"
  ReadTimeout: 0
  ReadHeaderTimeout: 0
  WriteTimeout: 0
  IdleTimeout: 0
  MaxHeaderBytes: 10485760

PhaseServer:
  BaseURL: "http://127.0.0.1:30180"
  Collection: "ocr_artifacts"
  RootTopic: "ocr.documents"
  ServiceEmail: "pdftesseract@gmail.com"
  ChunkBytes: 4194304
  UseGzip: true
  SavePTOnFinalize: false
  ShipLogs: true

Pipeline:
  DefaultDPI: 300
  MinContourArea: 900
  MaxContourArea: -1
  DefaultDenoisePreset: "word_denoise"
  SegmentByDefault: true
  PDFiumMaxTotal: 4
  Stages:
    ingest:
      WorkerCount: 4
      MaxQueueSize: 64
      FlushIntervalMs: 50
    pdf_render:
      WorkerCount: 4
      MaxQueueSize: 64
      FlushIntervalMs: 50
    segment:
      WorkerCount: 8
      MaxQueueSize: 128
      FlushIntervalMs: 50
    denoise:
      WorkerCount: 8
      MaxQueueSize: 256
      FlushIntervalMs: 50
    ocr:
      WorkerCount: 8
      MaxQueueSize: 256
      FlushIntervalMs: 50
    persist:
      WorkerCount: 8
      MaxQueueSize: 256
      FlushIntervalMs: 50
    finalize:
      WorkerCount: 4
      MaxQueueSize: 64
      FlushIntervalMs: 50

OCR:
  DefaultProvider: "tesseract"
  Tesseract:
    Enabled: true
    BinaryPath: ""
    TessdataDir: ""
    Language: "eng"
    PSM: 6
  HTTP:
    Enabled: false
    Name: "http"
    Endpoint: ""
    ModelID: "remote-ocr"
    TimeoutMs: 15000
  Ollama:
    Enabled: false
    Model: "llava"
    EmbeddingModel: ""
    Prompt: "Extract all visible text verbatim without commentary."
  MLTools:
    Enabled: true
    NumClasses: 95
    BeamSize: 4
    Seed: 42
